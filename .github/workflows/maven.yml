name: QuickChat Maven Tests

on:
  push:
    branches: [master, part-2-messaging]
  pull_request:
    branches: [master, part-2-messaging]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run Maven tests
        run: mvn -B test
